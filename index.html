<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Home Screen -->
        <div class="home-screen" id="homeScreen">
            <h1>Tic Tac Toe</h1>
            <button id="playPvP">Player vs Player</button>
            <button id="playPvC">Player vs Computer</button>
        </div>

        <!-- Game Board -->
        <div class="game-board" id="gameBoard">
            <div class="row">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
            </div>
            <div class="row">
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
            </div>
            <div class="row">
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>

        <!-- Game Message -->
        <div class="message" id="message">
            <p id="resultMessage"></p>
            <button id="restartBtn">Restart Game</button>
            <a href="index.html"><button>Home</button></a>
        </div>
    </div>

    <!-- Social Footer -->
    <footer class="social-footer">
        <div class="social-icons">
            <a href="https://www.facebook.com/kartik.sheirgill/" target="_blank" rel="noopener noreferrer" class="social-icon">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://github.com/Kartikvarodra" target="_blank" rel="noopener noreferrer" class="social-icon">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://www.instagram.com/codifyx_69/" target="_blank" rel="noopener noreferrer" class="social-icon">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
        <p class="footer-text">© 2025 CodifyX. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
